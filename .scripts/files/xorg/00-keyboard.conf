# Installed to /etc/X11/xorg.conf.d/ by .scripts/after/linux/setup_keyboard.sh
# Applies to every keyboard, including ones plugged in after X started.
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
    Option "XkbOptions" "caps:escape"
EndSection
